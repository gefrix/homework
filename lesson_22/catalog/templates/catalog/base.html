{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Skystore — магазин плагинов и примеров кода">
    <title>{% block title %}Skystore{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'catalog/css/styles.css' %}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
{% include 'catalog/includes/menu.html' %}

<main class="flex-grow-1">
    {% block content %}{% endblock %}
</main>

<footer class="container border-top py-5 mt-5">
    <div class="row g-4">
        <div class="col-12 col-md-3">
            <strong class="d-block fs-5">Skystore</strong>
            <small class="text-body-secondary">&copy; <span data-current-year>2026</span></small>
        </div>
        <div class="col-6 col-md-3">
            <h2 class="h5">Категории</h2>
            <ul class="list-unstyled small">
                <li><a class="footer-link" href="#">Рассылки</a></li>
                <li><a class="footer-link" href="#">Telegram-боты</a></li>
                <li><a class="footer-link" href="#">Полезные утилиты</a></li>
                <li><a class="footer-link" href="#">Веб-приложения</a></li>
            </ul>
        </div>
        <div class="col-6 col-md-3">
            <h2 class="h5">Дополнительно</h2>
            <ul class="list-unstyled small">
                <li><a class="footer-link" href="#">Блог</a></li>
                <li><a class="footer-link" href="#">Поддержка</a></li>
            </ul>
        </div>
        <div class="col-6 col-md-3">
            <h2 class="h5">О нас</h2>
            <ul class="list-unstyled small">
                <li><a class="footer-link" href="{% url 'catalog:contacts' %}">Контакты</a></li>
            </ul>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'catalog/js/site.js' %}"></script>
</body>
</html>
