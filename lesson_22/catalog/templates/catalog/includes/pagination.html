{% if page_obj.has_other_pages %}
<nav class="mt-5" aria-label="Навигация по страницам каталога">
    <ul class="pagination justify-content-center">
        <li class="page-item {% if not page_obj.has_previous %}disabled{% endif %}">
            {% if page_obj.has_previous %}
            <a class="page-link" href="?page={{ page_obj.previous_page_number }}" aria-label="Предыдущая страница">Назад</a>
            {% else %}
            <span class="page-link">Назад</span>
            {% endif %}
        </li>
        {% for page_number in page_obj.paginator.page_range %}
        <li class="page-item {% if page_obj.number == page_number %}active{% endif %}">
            <a class="page-link" href="?page={{ page_number }}">{{ page_number }}</a>
        </li>
        {% endfor %}
        <li class="page-item {% if not page_obj.has_next %}disabled{% endif %}">
            {% if page_obj.has_next %}
            <a class="page-link" href="?page={{ page_obj.next_page_number }}" aria-label="Следующая страница">Вперёд</a>
            {% else %}
            <span class="page-link">Вперёд</span>
            {% endif %}
        </li>
    </ul>
</nav>
{% endif %}
