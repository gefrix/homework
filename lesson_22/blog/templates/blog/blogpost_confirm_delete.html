{% extends 'catalog/base.html' %}

{% block title %}Удаление статьи — Skystore{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="card border-0 shadow-sm mx-auto delete-card">
        <div class="card-body p-4 p-md-5 text-center">
            <p class="text-danger fw-semibold mb-2">Необратимое действие</p>
            <h1 class="h2 mb-3">Удалить статью?</h1>
            <p class="text-body-secondary mb-4">«{{ object.title }}» будет удалена без возможности восстановления.</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
                    <button class="btn btn-danger" type="submit">Удалить</button>
                    <a class="btn btn-outline-secondary" href="{% url 'blog:blog_detail' object.pk %}">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
